<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wein-Assistent">
<title>Tom's interaktiver Wein-Assistent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #F7F3EC;
  --surface: #FFFFFF;
  --surface2: #F0EBE1;
  --border: rgba(28,20,16,0.1);
  --gold: #9A6E1A;
  --gold-dim: rgba(154,110,26,0.1);
  --gold-border: rgba(154,110,26,0.35);
  --text: #1C1410;
  --text-dim: rgba(28,20,16,0.5);
  --text-muted: rgba(28,20,16,0.3);
  --rot: #A0283E;
  --rot-bg: rgba(160,40,62,0.07);
  --weiss: #3A7A3C;
  --weiss-bg: rgba(58,122,60,0.07);
  --rose: #B84060;
  --rose-bg: rgba(184,64,96,0.07);
  --green: #2E7D34;
  --green-bg: rgba(46,125,52,0.08);
  --green-border: rgba(46,125,52,0.3);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 600px;
  margin: 0 auto;
}

/* ── HEADER ── */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.25rem 0.85rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}
.app-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-weight: 600;
}
.app-title small {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.1rem;
}
.reset-btn {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.3rem 0.75rem;
  cursor: pointer;
}
.reset-btn:active { background: var(--surface2); }

/* ── TYPE TABS ── */
.type-tabs { display: flex; gap: 0.4rem; }
.type-tab {
  flex: 1;
  padding: 0.5rem 0.25rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 0.35rem;
}
.type-tab:active { opacity: 0.7; }
.type-tab.active-rot    { background: var(--rot-bg);  border-color: var(--rot);  color: var(--rot);  font-weight: 500; }
.type-tab.active-weiss  { background: var(--weiss-bg); border-color: var(--weiss); color: var(--weiss); font-weight: 500; }
.type-tab.active-rose   { background: var(--rose-bg); border-color: var(--rose); color: var(--rose); font-weight: 500; }
.type-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── STEP NAV ── */
.step-nav {
  display: flex;
  gap: 0.3rem;
  padding: 0.7rem 1.25rem;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.step-nav::-webkit-scrollbar { display: none; }
.step-nav-item {
  display: flex; align-items: center; gap: 0.3rem;
  padding: 0.35rem 0.7rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.68rem;
  color: var(--text-dim);
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.step-nav-item:active { opacity: 0.7; }
.step-nav-item.active    { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); font-weight: 500; }
.step-nav-item.completed { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.step-nav-num {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: currentColor;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 0.5rem;
  color: white;
  flex-shrink: 0;
  opacity: 0.85;
}

/* ── MAIN ── */
main { padding: 1.1rem 1.25rem; }

/* ── STEP ── */
.step-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.2rem;
}
.step-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.1;
  margin-bottom: 0.2rem;
}
.step-hint {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 1rem;
}

/* ── COLOR CHIPS ── */
.color-chips { display: flex; flex-direction: column; gap: 0.45rem; }
.color-chip {
  display: flex; align-items: center; gap: 0.85rem;
  padding: 0.7rem 0.9rem;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  user-select: none;
}
.color-chip:active { transform: scale(0.98); }
.color-chip.selected { border-color: var(--gold-border); background: var(--gold-dim); }
.swatch-circle { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 1px 5px rgba(0,0,0,0.2); }
.color-chip-label { font-size: 0.82rem; color: var(--text); font-weight: 500; line-height: 1.2; }
.color-chip-hint  { font-size: 0.63rem; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 0.1rem; }
.color-chip.selected .color-chip-label { color: var(--gold); }
.chip-check {
  margin-left: auto;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  flex-shrink: 0;
  color: transparent;
}
.color-chip.selected .chip-check { background: var(--gold); border-color: var(--gold); color: white; }

/* ── CLUE CHIPS ── */
.clue-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip {
  padding: 0.5rem 0.85rem;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 0.78rem;
  cursor: pointer;
  user-select: none;
  line-height: 1.2;
}
.chip:active { transform: scale(0.96); }
.chip.selected { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); font-weight: 500; }
.chip.selected::before { content: '✓ '; }

/* ── FOOTER NAV ── */
.step-footer {
  display: flex; gap: 0.6rem;
  margin-top: 1.5rem;
  padding-bottom: 2rem;
}
.btn-back {
  padding: 0.75rem 1.1rem;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  cursor: pointer;
}
.btn-back:active { background: var(--surface2); }
.btn-next {
  flex: 1;
  padding: 0.75rem 1.1rem;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--text);
  color: var(--bg);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
}
.btn-next:active { opacity: 0.8; }
.btn-next.gold { background: var(--gold); color: white; }

/* ── RESULTS ── */
.results-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: 0.2rem;
}
.results-sub { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 1.1rem; }

.hypothesis-card {
  background: var(--surface);
  border: 1.5px solid var(--gold-border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  margin-bottom: 1rem;
}
.hypo-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.65rem;
}
.hypo-entry {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--border);
}
.hypo-entry:last-child { border-bottom: none; }
.hypo-rank { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-muted); width: 16px; flex-shrink: 0; }
.hypo-rank.first { color: var(--gold); font-weight: 500; }
.hypo-medal { font-size: 1rem; flex-shrink: 0; }
.hypo-grape { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 600; flex: 1; }
.hypo-grape.first { color: var(--gold); }
.hypo-score { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--text-muted); background: var(--surface2); padding: 0.15rem 0.45rem; border-radius: 10px; }
.score-row { margin-top: 0.25rem; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 2px; background: var(--gold); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

.candidates-section { margin-top: 1.1rem; }
.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.55rem;
}
.candidate-row {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-sm);
  margin-bottom: 0.3rem;
  border: 1px solid var(--border);
  background: var(--surface);
}
.candidate-row.top      { border-color: var(--gold-border); background: var(--gold-dim); }
.candidate-row.included { border-color: var(--green-border); background: var(--green-bg); }
.candidate-row.excluded { opacity: 0.28; filter: grayscale(1); }
.cand-icon { font-size: 0.8rem; width: 18px; text-align: center; flex-shrink: 0; }
.cand-name { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; font-weight: 600; }
.cand-region { font-size: 0.62rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.cand-score { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

/* ── LIVE TOP-3 BAR ── */
.live-bar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.live-bar::-webkit-scrollbar { display: none; }
.live-bar-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  flex-shrink: 0;
}
.live-bar-candidates {
  display: flex;
  gap: 0.4rem;
  align-items: center;
}
.live-pill {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.3rem 0.65rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  white-space: nowrap;
  transition: all 0.25s;
}
.live-pill.rank-1 {
  border-color: var(--gold-border);
  background: var(--gold-dim);
}
.live-pill-medal { font-size: 0.75rem; }
.live-pill-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
}
.live-pill.rank-1 .live-pill-name { color: var(--gold); }
.live-pill-score {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  color: var(--text-muted);
}
.live-bar-empty {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-style: italic;
}


.selected-summary {
  margin-top: 1.1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem 1rem;
}
.summary-section { margin-bottom: 0.8rem; }
.summary-section:last-child { margin-bottom: 0; }
.summary-section-name {
  font-size: 0.68rem; font-weight: 500; color: var(--text-dim);
  margin-bottom: 0.35rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.summary-section-name::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.summary-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.summary-tag {
  font-size: 0.72rem;
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid var(--gold-border);
  border-radius: 20px;
  padding: 0.25rem 0.6rem;
  display: flex; align-items: center; gap: 0.3rem;
  cursor: pointer;
}
.summary-tag:active { opacity: 0.6; }
.remove-x { font-size: 0.6rem; opacity: 0.5; }
.summary-empty { font-size: 0.73rem; color: var(--text-muted); font-style: italic; }
.empty-results { text-align: center; padding: 2rem 1rem; font-size: 0.8rem; color: var(--text-muted); line-height: 1.7; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header-top">
    <div class="app-title">
      <small>Blinddegustation</small>
      Tom's Wein-Assistent
    </div>
    <button class="reset-btn" onclick="resetAll()">↺ Reset</button>
  </div>
  <div class="type-tabs">

    <button class="type-tab" id="tab-rose" onclick="setWineType('rose')">
      <span class="type-dot" style="background:#B84060"></span>Rosé
    </button>
  </div>
</div>

<div class="step-nav" id="step-nav"></div>
<div class="live-bar" id="live-bar" style="display:none">
  <span class="live-bar-label">Top 3</span>
  <div class="live-bar-candidates" id="live-bar-candidates"></div>
</div>
<main id="main-content"></main>

// ═══════════════════ STATE ═══════════════════
let currentType = 'rot';
let currentStep = 0;
let selectedClues = {};

function getSteps() { return STEPS[currentType]; }
function getWines() { return WINES[currentType]; }

function initState() {
  selectedClues = {};
  getSteps().forEach(s => { selectedClues[s.id] = new Set(); });
}

// ═══════════════════ SCORING ═══════════════════
function getAllSelected() {
  const all = new Set();
  Object.values(selectedClues).forEach(s => s.forEach(id => all.add(id)));
  return all;
}

function scoreWines() {
  const all = getAllSelected();
  return getWines().map(wine => {
    let score = 0;
    all.forEach(id => { score += wine.clues[id] ?? 0; });
    return { ...wine, score };
  }).sort((a, b) => b.score - a.score);
}

// ═══════════════════ RENDER ═══════════════════
function render() {
  renderStepNav();
  renderLiveBar();
  renderMain();
}

function renderLiveBar() {
  const bar = document.getElementById('live-bar');
  const cands = document.getElementById('live-bar-candidates');
  const total = getAllSelected().size;

  // Hide on results page (it's redundant there)
  if (currentStep === 'results') { bar.style.display = 'none'; return; }

  bar.style.display = 'flex';

  if (total === 0) {
    cands.innerHTML = `<span class="live-bar-empty">Noch keine Merkmale gewählt</span>`;
    return;
  }

  const scored = scoreWines();
  const top3 = scored.filter(w => w.score > 0).slice(0, 3);
  const medals = ['🥇','🥈','🥉'];

  if (top3.length === 0) {
    cands.innerHTML = `<span class="live-bar-empty">Keine Treffer – Merkmale prüfen</span>`;
    return;
  }

  cands.innerHTML = top3.map((w, i) =>
    `<div class="live-pill rank-${i+1}">
      <span class="live-pill-medal">${medals[i]}</span>
      <span class="live-pill-name">${w.name}</span>
      <span class="live-pill-score">+${w.score}</span>
    </div>`
  ).join('');
}

function renderStepNav() {
  const steps = getSteps();
  document.getElementById('step-nav').innerHTML =
    steps.map((s, i) => {
      const cnt = selectedClues[s.id] ? selectedClues[s.id].size : 0;
      const done = currentStep === 'results' || i < currentStep;
      const active = currentStep === i;
      const cls = active ? 'active' : done ? 'completed' : '';
      return `<div class="step-nav-item ${cls}" onclick="goToStep(${i})">
        <span class="step-nav-num">${done ? '✓' : i+1}</span>
        ${s.title}${cnt > 0 ? ` (${cnt})` : ''}
      </div>`;
    }).join('') +
    `<div class="step-nav-item ${currentStep==='results'?'active':''}" onclick="goToStep('results')">
      <span class="step-nav-num">★</span>Ergebnis
    </div>`;
}

function renderMain() {
  if (currentStep === 'results') {
    document.getElementById('main-content').innerHTML = buildResults();
  } else {
    document.getElementById('main-content').innerHTML = buildStep();
  }
}

function buildStep() {
  const steps = getSteps();
  const step = steps[currentStep];
  const sel = selectedClues[step.id] || new Set();
  const isLast = currentStep === steps.length - 1;

  const cluesHTML = step.type === 'color'
    ? `<div class="color-chips">` + step.clues.map(c =>
        `<div class="color-chip ${sel.has(c.id)?'selected':''}" onclick="toggleClue('${c.id}')">
          <div class="swatch-circle" style="background:${c.swatch}"></div>
          <div class="color-chip-text">
            <div class="color-chip-label">${c.label}</div>
            <div class="color-chip-hint">${c.hint}</div>
          </div>
          <div class="chip-check">✓</div>
        </div>`).join('') + `</div>`
    : `<div class="clue-chips">` + step.clues.map(c =>
        `<div class="chip ${sel.has(c.id)?'selected':''}" onclick="toggleClue('${c.id}')">
          ${c.label}
        </div>`).join('') + `</div>`;

  return `
    <div class="step-label">Schritt ${currentStep+1} von ${steps.length}</div>
    <div class="step-title">${step.title}</div>
    <div class="step-hint">${step.hint}</div>
    ${cluesHTML}
    <div class="step-footer">
      ${currentStep > 0 ? `<button class="btn-back" onclick="prevStep()">← Zurück</button>` : ''}
      <button class="btn-next ${isLast?'gold':''}" onclick="${isLast ? "goToStep('results')" : 'nextStep()'}">
        ${isLast ? '★ Ergebnis anzeigen' : 'Weiter →'}
      </button>
    </div>`;
}

function buildResults() {
  const scored = scoreWines();
  const steps = getSteps();
  const top3 = scored.filter(w => w.score > 0).slice(0, 3);
  const maxScore = Math.max(...scored.map(w => Math.max(0, w.score)), 1);
  const medals = ['🥇','🥈','🥉'];
  const total = getAllSelected().size;

  // Hypothesis
  const hypoHTML = top3.length === 0
    ? `<div class="empty-results">Keine Übereinstimmungen.<br>Tippe auf einen Schritt oben, um Merkmale zu ändern.</div>`
    : `<div class="hypothesis-card">
        <div class="hypo-label">Meine Hypothese</div>` +
        top3.map((w,i) => `
          <div class="hypo-entry">
            <span class="hypo-rank ${i===0?'first':''}">${i+1}.</span>
            <span class="hypo-medal">${medals[i]}</span>
            <span class="hypo-grape ${i===0?'first':''}">${w.name}</span>
            <span class="hypo-score">+${w.score}</span>
          </div>
          <div class="score-row"><div class="score-fill" style="width:${Math.round(w.score/maxScore*100)}%"></div></div>
        `).join('') +
      `</div>`;

  // All candidates
  const candHTML = `<div class="candidates-section">
    <div class="section-label">Alle Kandidaten</div>` +
    scored.map(w => {
      const pct = Math.max(0, Math.round(w.score/maxScore*100));
      const cls = w.score < 0 ? 'excluded' : w.score === scored[0].score && w.score > 0 ? 'top' : w.score > 0 ? 'included' : '';
      const icon = cls==='top' ? '★' : cls==='included' ? '✓' : cls==='excluded' ? '✗' : '–';
      return `<div class="candidate-row ${cls}">
        <span class="cand-icon">${icon}</span>
        <div style="flex:1">
          <div class="cand-name">${w.name}</div>
          <div class="cand-region">${w.regions}</div>
          <div class="score-row" style="margin-top:0.2rem">
            <div class="score-fill" style="width:${pct}%"></div>
          </div>
        </div>
        <span class="cand-score">${w.score>0?'+':''}${w.score}</span>
      </div>`;
    }).join('') + `</div>`;

  // Selected clues summary
  const anySelected = Object.values(selectedClues).some(s => s.size > 0);
  let summaryBody = '';
  if (anySelected) {
    steps.forEach(step => {
      const sel = selectedClues[step.id];
      if (!sel || sel.size === 0) return;
      const tags = [...sel].map(id => {
        const clue = step.clues.find(c => c.id === id);
        const label = clue ? clue.label : id;
        return `<span class="summary-tag" onclick="removeClue('${id}','${step.id}')">
          ${label} <span class="remove-x">✕</span>
        </span>`;
      }).join('');
      summaryBody += `<div class="summary-section">
        <div class="summary-section-name">${step.title}</div>
        <div class="summary-tags">${tags}</div>
      </div>`;
    });
  } else {
    summaryBody = `<div class="summary-empty">Noch keine Merkmale gewählt.</div>`;
  }

  return `
    <div class="results-title">Ergebnis</div>
    <div class="results-sub">Basierend auf ${total} gewählten Merkmal${total===1?'':'en'}</div>
    ${hypoHTML}
    ${candHTML}
    <div class="selected-summary">
      <div class="section-label">Gewählte Merkmale <span style="font-size:0.65rem;opacity:0.6">(tippen zum Entfernen)</span></div>
      ${summaryBody}
    </div>
    <div class="step-footer">
      <button class="btn-back" onclick="prevStep()">← Zurück</button>
      <button class="btn-next" onclick="resetAll()">↺ Neu starten</button>
    </div>`;
}

// ═══════════════════ INTERACTIONS ═══════════════════
function toggleClue(id) {
  if (typeof currentStep !== 'number') return;
  const step = getSteps()[currentStep];
  if (!step) return;
  const s = selectedClues[step.id];
  s.has(id) ? s.delete(id) : s.add(id);
  renderMain();
  renderStepNav();
  renderLiveBar();
}

function removeClue(clueId, stepId) {
  if (selectedClues[stepId]) selectedClues[stepId].delete(clueId);
  renderMain();
  renderStepNav();
  renderLiveBar();
}

function nextStep() {
  const steps = getSteps();
  if (typeof currentStep === 'number' && currentStep < steps.length - 1) {
    currentStep++;
    render();
    window.scrollTo(0,0);
  }
}

function prevStep() {
  if (currentStep === 'results') currentStep = getSteps().length - 1;
  else if (currentStep > 0) currentStep--;
  render();
  window.scrollTo(0,0);
}

function goToStep(n) {
  currentStep = n;
  render();
  window.scrollTo(0,0);
}

function setWineType(type) {
  currentType = type;
  currentStep = 0;
  document.querySelectorAll('.type-tab').forEach(t =>
    t.classList.remove('active-rot','active-weiss','active-rose'));
  document.getElementById('tab-'+type).classList.add('active-'+type);
  initState();
  render();
  window.scrollTo(0,0);
}

function resetAll() {
  currentStep = 0;
  initState();
  render();
  window.scrollTo(0,0);
}

// ═══════════════════ INIT ═══════════════════
initState();
render();
</script>
</body>
</html>

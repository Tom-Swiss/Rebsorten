<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tom's interaktiver Wein-Assistent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #F7F3EC;
  --bg2: #F0EBE1;
  --bg3: #EDE6D8;
  --surface: #FFFFFF;
  --surface2: #F7F3EC;
  --border: rgba(28,20,16,0.1);
  --border-active: rgba(184,146,74,0.5);
  --gold: #9A6E1A;
  --gold-dim: rgba(154,110,26,0.12);
  --gold-glow: rgba(154,110,26,0.06);
  --text: #1C1410;
  --text-dim: rgba(28,20,16,0.55);
  --text-muted: rgba(28,20,16,0.35);

  --rot: #A0283E;
  --rot-dim: rgba(160,40,62,0.12);
  --rot-bg: rgba(160,40,62,0.06);
  --weiss: #3A7A3C;
  --weiss-dim: rgba(58,122,60,0.12);
  --weiss-bg: rgba(58,122,60,0.06);
  --rose: #B84060;
  --rose-dim: rgba(184,64,96,0.12);
  --rose-bg: rgba(184,64,96,0.06);

  --included: #2E7D34;
  --excluded: #A83030;
  --neutral: rgba(28,20,16,0.3);

  --radius: 10px;
  --radius-sm: 6px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
  opacity: 0.15;
}

/* ── HEADER ── */
header {
  padding: 1.5rem 1.5rem 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
}
.header-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 300;
  letter-spacing: 0.03em;
  color: var(--text);
  line-height: 1.1;
}
.header-title span {
  display: block;
  font-size: 0.65rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.25rem;
}

/* ── WINE TYPE TABS ── */
.type-tabs {
  display: flex;
  gap: 0.5rem;
  padding: 1.2rem 1.5rem 0;
}
.type-tab {
  flex: 1;
  padding: 0.65rem 0.5rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.type-tab:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
.type-tab.active-rot { background: var(--rot-bg); border-color: var(--rot); color: var(--rot); }
.type-tab.active-weiss { background: var(--weiss-bg); border-color: var(--weiss); color: var(--weiss); }
.type-tab.active-rose { background: var(--rose-bg); border-color: var(--rose); color: var(--rose); }
.type-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── MAIN LAYOUT ── */
.app {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 1rem;
  padding: 1rem 1.5rem 2rem;
  min-height: calc(100vh - 120px);
}
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; }
  .candidates-panel { order: -1; }
}

/* ── LEFT: CLUE STEPS ── */
.steps-panel {}

.step-section {
  margin-bottom: 0.75rem;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
}
.step-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.8rem 1rem;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.step-header:hover { background: rgba(255,255,255,0.03); }
.step-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--gold);
  flex-shrink: 0;
}
.step-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  font-weight: 600;
  flex: 1;
}
.step-subtitle {
  font-size: 0.62rem;
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.08em;
}
.step-selected-count {
  font-size: 0.6rem;
  font-family: 'DM Mono', monospace;
  background: var(--gold-dim);
  color: var(--gold);
  border-radius: 20px;
  padding: 0.15rem 0.5rem;
  opacity: 0;
  transition: opacity 0.2s;
}
.step-selected-count.visible { opacity: 1; }
.step-chevron {
  color: var(--text-muted);
  font-size: 0.7rem;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.step-section.open .step-chevron { transform: rotate(180deg); }

.step-body {
  display: none;
  padding: 0 0.75rem 0.75rem;
  border-top: 1px solid var(--border);
}
.step-section.open .step-body { display: block; }

/* ── CLUE CHIPS ── */
.clue-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  padding-top: 0.75rem;
}
.chip {
  padding: 0.4rem 0.8rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text-dim);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  line-height: 1.2;
}
.chip:hover {
  border-color: rgba(255,255,255,0.2);
  color: var(--text);
  background: var(--surface2);
}
.chip.selected {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
}
.chip.selected::before { content: '✓ '; font-size: 0.65rem; }

/* Color swatches as chips */
.color-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.75rem; }
.color-chip {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.9rem 0.5rem 0.6rem;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: var(--bg3);
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
}
.color-chip:hover { border-color: rgba(255,255,255,0.2); background: var(--surface2); }
.color-chip.selected { border-color: var(--gold); background: var(--gold-dim); }
.swatch-circle { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.4); flex-shrink: 0; }
.color-chip-label { font-size: 0.73rem; color: var(--text-dim); transition: color 0.18s; }
.color-chip:hover .color-chip-label,
.color-chip.selected .color-chip-label { color: var(--text); }

/* Reset button */
.reset-btn {
  margin-top: 1rem;
  padding: 0.55rem 1.2rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.reset-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

/* ── RIGHT: CANDIDATES PANEL ── */
.candidates-panel {
  position: sticky;
  top: 1rem;
  height: fit-content;
}

.panel-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.panel-head {
  padding: 0.8rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-head-title {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
}
.candidate-count {
  font-family: 'DM Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  transition: all 0.3s;
}
.candidate-count.urgent { color: var(--gold); }

.candidates-list {
  padding: 0.5rem;
  max-height: 70vh;
  overflow-y: auto;
}
.candidates-list::-webkit-scrollbar { width: 3px; }
.candidates-list::-webkit-scrollbar-track { background: transparent; }
.candidates-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.candidate-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.6rem;
  border-radius: var(--radius-sm);
  margin-bottom: 0.3rem;
  transition: all 0.3s;
  border: 1px solid transparent;
}
.candidate-item.included {
  background: rgba(90,175,99,0.08);
  border-color: rgba(90,175,99,0.2);
}
.candidate-item.excluded {
  opacity: 0.25;
  filter: grayscale(1);
}
.candidate-item.top-match {
  background: rgba(196,150,60,0.1);
  border-color: rgba(196,150,60,0.3);
}

.candidate-score-bar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  font-weight: 400;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text-muted);
  transition: all 0.3s;
}
.candidate-item.included .candidate-score-bar {
  background: rgba(90,175,99,0.15);
  border-color: rgba(90,175,99,0.4);
  color: var(--included);
}
.candidate-item.top-match .candidate-score-bar {
  background: rgba(196,150,60,0.2);
  border-color: var(--gold);
  color: var(--gold);
  font-size: 0.8rem;
}

.candidate-info {}
.candidate-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.1;
  transition: color 0.3s;
}
.candidate-item.excluded .candidate-name { color: var(--text-muted); }
.candidate-regions {
  font-size: 0.62rem;
  color: var(--text-muted);
  margin-top: 0.1rem;
  font-family: 'DM Mono', monospace;
  line-height: 1.3;
}
.candidate-item.included .candidate-regions { color: rgba(90,175,99,0.6); }
.candidate-item.top-match .candidate-regions { color: rgba(196,150,60,0.6); }

/* Score bar visual */
.score-track {
  margin-top: 0.2rem;
  height: 2px;
  background: var(--bg3);
  border-radius: 1px;
  overflow: hidden;
}
.score-fill {
  height: 100%;
  border-radius: 1px;
  background: var(--text-muted);
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1), background 0.3s;
}
.candidate-item.included .score-fill { background: var(--included); }
.candidate-item.top-match .score-fill { background: var(--gold); }

/* Hypothesis box */
.hypothesis-box {
  margin-top: 0.75rem;
  padding: 0.9rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all 0.3s;
}
.hypothesis-box.active {
  border-color: var(--gold);
  background: rgba(196,150,60,0.06);
}
.hypothesis-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.5rem;
}
.hypothesis-empty {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-style: italic;
}
.hypothesis-top {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.hypothesis-entry {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.hypothesis-rank {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  color: var(--text-muted);
  width: 14px;
  flex-shrink: 0;
}
.hypothesis-rank.first { color: var(--gold); }
.hypothesis-grape {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
}
.hypothesis-grape.first { color: var(--gold); }
.hypothesis-hint {
  font-size: 0.65rem;
  color: var(--text-muted);
  margin-left: auto;
  font-family: 'DM Mono', monospace;
}

/* Selected clues summary */
.selected-clues {
  margin-top: 0.75rem;
}
.selected-clues-head {
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}
.selected-clue-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.65rem;
  background: var(--gold-dim);
  color: var(--gold);
  border-radius: 3px;
  padding: 0.15rem 0.4rem;
  margin: 0.15rem 0.15rem 0 0;
  cursor: pointer;
  transition: opacity 0.2s;
}
.selected-clue-tag:hover { opacity: 0.7; }
.selected-clue-tag .remove { font-size: 0.6rem; color: rgba(196,150,60,0.5); }

/* ── ANIMATIONS ── */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.candidate-item { animation: fadeSlideIn 0.25s ease; }

/* No selection state hint */
.no-selection-hint {
  padding: 1.5rem 1rem;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  font-style: italic;
  line-height: 1.6;
}
</style>
</head>
<body>

<header>
  <div class="header-title">
    <span>Blinddegustation</span>
    Tom's interaktiver Wein-Assistent
  </div>
</header>

<div class="type-tabs">
  <button class="type-tab active-rot" id="tab-rot" onclick="setWineType('rot')">
    <span class="type-dot" style="background:#C4546B"></span> Rotwein
  </button>
  <button class="type-tab" id="tab-weiss" onclick="setWineType('weiss')">
    <span class="type-dot" style="background:#7EB87F"></span> Weisswein
  </button>
  <button class="type-tab" id="tab-rose" onclick="setWineType('rose')">
    <span class="type-dot" style="background:#E0899A"></span> Rosé
  </button>
</div>

<div class="app">
  <div class="steps-panel" id="steps-panel">
    <!-- Generated by JS -->
  </div>

  <div class="candidates-panel">
    <div class="panel-box">
      <div class="panel-head">
        <span class="panel-head-title">Kandidaten</span>
        <span class="candidate-count" id="candidate-count">— / —</span>
      </div>
      <div class="candidates-list" id="candidates-list">
        <div class="no-selection-hint">Tippe auf Merkmale links,<br>um die Kandidaten einzugrenzen.</div>
      </div>
    </div>

    <div class="hypothesis-box" id="hypothesis-box">
      <div class="hypothesis-label">Meine Hypothese</div>
      <div class="hypothesis-empty" id="hypothesis-empty">Noch keine Merkmale gewählt.</div>
      <div class="hypothesis-top" id="hypothesis-top" style="display:none"></div>
    </div>

    <div class="selected-clues" id="selected-clues-panel" style="display:none">
      <div class="selected-clues-head">Gewählte Merkmale</div>
      <div id="selected-clues-tags"></div>
    </div>

    <button class="reset-btn" onclick="resetAll()">
      ↺ Alles zurücksetzen
    </button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════

const WINES = {
  rot: [
    {
      id: 'cab_sauv',
      name: 'Cabernet Sauvignon',
      regions: 'Bordeaux · Napa · Chile · Australien',
      clues: {
        // color
        color_dark: 3, color_granat: 2, color_opaque: 3,
        // rim
        rim_jung: 1, rim_purple: 1,
        // viskos
        visk_thick: 1,
        // nose fruit
        nose_dark_fruit: 3, nose_cassis: 3, nose_pflaume: 2,
        nose_red_fruit: -2,
        // nose character
        nose_paprika: 3, nose_zeder: 3, nose_tabak: 2,
        nose_pepper: 1, nose_garrigue: -1,
        // nose maturation
        nose_leder: 2, nose_teer: -1,
        // palate
        palate_tannin_high: 3, palate_acid_med: 1,
        palate_body_full: 2, palate_alc_high: 1,

        palate_tannin_none: -3, palate_tannin_silk: -1,
      }
    },
    {
      id: 'merlot',
      name: 'Merlot',

        nose_dark_fruit: 2, nose_pflaume: 3, nose_cassis: 1,
        nose_schoko: 2, nose_veilchen: 2,
        palate_tannin_silk: 3, palate_acid_med: 1,
        palate_body_med: 2, palate_body_full: 1,

        palate_alc_high: -1,
      }
    },
    {
      id: 'pinot_noir',
      name: 'Pinot Noir',
      regions: 'Burgund · Oregon · Neuseeland · Baden',
      clues: {
        color_light_ruby: 3, color_transparent: 3,
        rim_jung: 1, visk_thin: 2,
        nose_red_fruit: 3, nose_kirsche: 3, nose_erdbeere: 2,
        nose_pilze: 2, nose_erde: 2, nose_rosen: 2,
        palate_tannin_silk: 2, palate_tannin_none: 1,
        palate_acid_high: 2, palate_body_light: 3,

    },
    {
      id: 'syrah',

        rim_purple: 2,
        nose_dark_fruit: 2, nose_brombeere: 2,
        nose_pepper: 3, nose_lakritz: 3, nose_eukalyptus: 2,
        nose_leder: 2, nose_schoko: 1,
        palate_tannin_high: 2, palate_acid_med: 1,
        palate_body_full: 2,
        color_transparent: -2, palate_tannin_none: -2,
      }
    },
    {
      id: 'grenache',
      name: 'Grenache / Garnacha',
      regions: 'Châteauneuf · Priorat · Navarra',
      clues: {
        color_light_ruby: 2, color_transparent: 2,
        rim_jung: 1,
        nose_red_fruit: 3, nose_erdbeere: 2, nose_kirsche: 1,
        nose_garrigue: 3, nose_pepper_white: 2,
        palate_tannin_none: 2, palate_tannin_silk: 1,
        palate_acid_low: 2, palate_body_med: 2,
        palate_alc_high: 1,
        palate_tannin_high: -3, color_opaque: -2,
      }
    },
    {
      id: 'tempranillo',
      name: 'Tempranillo',
      regions: 'Rioja · Ribera del Duero · Toro',
      clues: {
        color_ruby: 2, color_granat: 2,
        rim_orange: 1,
        nose_dark_fruit: 1, nose_kirsche: 2,
        nose_leder: 2, nose_tabak: 2, nose_vanille: 2,
        nose_zeder: 1,
        palate_tannin_med: 2, palate_acid_med: 1,
        palate_body_med: 2,
      }
    },
    {
      id: 'sangiovese',
      name: 'Sangiovese',
      regions: 'Chianti · Brunello · Morellino',
      clues: {
        color_ruby: 2, color_granat: 1,
        nose_red_fruit: 2, nose_kirsche: 3, nose_sauerkirsche: 3,
        nose_balsamico: 3, nose_erde: 2, nose_tabak: 1,
        palate_tannin_high: 2, palate_acid_high: 3,
        palate_body_med: 2,
        palate_acid_low: -3,
      }
    },
    {
      id: 'nebbiolo',
      name: 'Nebbiolo',
      regions: 'Barolo · Barbaresco · Gattinara',
      clues: {
        color_light_ruby: 2, color_transparent: 1,
        rim_orange: 2,
        nose_rosen: 3, nose_teer: 3, nose_tabak: 2,
        nose_sauerkirsche: 2, nose_pilze: 1,
        palate_tannin_high: 3, palate_acid_high: 3,
        palate_body_med: 1,
        palate_tannin_none: -3, palate_acid_low: -3,
        color_opaque: -2,
      }
    },

        { id: 'r_nose_brombeere', label: '🫐 Brombeere / dunkle Früchte' },
        { id: 'r_nose_blumen', label: '🌸 Blumig / zart florale Note' },
        { id: 'r_nose_kraeuter', label: '🌿 Kräuter / Garrigue' },
        { id: 'r_nose_mineral', label: '🪨 Mineralisch / salzig' },
        { id: 'r_nose_veilchen', label: '💜 Veilchen / dunkle Blüten' },
        { id: 'r_nose_pepper', label: '🌶 Würzig / Pfeffer' },
        { id: 'r_nose_zitrus', label: '🍋 Zitrus / frische Säure' },
        { id: 'r_palate_trocken', label: '🏜 Gaumen: komplett trocken' },
        { id: 'r_palate_süss', label: '🍬 Gaumen: merklich süss' },
        { id: 'r_palate_acid_high', label: '⚡ Säure: hoch / lebendig' },
        { id: 'r_palate_acid_med', label: '💧 Säure: mittel / ausgewogen' },
        { id: 'r_palate_body_light', label: '🫧 Körper: leicht' },
        { id: 'r_palate_body_med', label: '⚖️ Körper: mittel' },
        { id: 'r_palate_body_full', label: '🏋️ Körper: kräftig' },
        { id: 'r_palate_salzig', label: '🌊 Mineralisch-salziger Abgang' },
      ]
    },
  ]
};

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let currentType = 'rot';
let selectedClues = new Set();

// ══════════════════════════════════════════════════════
// SCORING
// ══════════════════════════════════════════════════════
function scoreWines() {
  const wines = WINES[currentType];
  const scored = wines.map(wine => {
    let score = 0;
    let maxPossible = 0;
    let hitCount = 0;
    selectedClues.forEach(clueId => {
      const val = wine.clues[clueId] ?? 0;
      score += val;
      if (val > 0) hitCount++;
    });
    // Max possible if all selected clues matched perfectly
    selectedClues.forEach(clueId => {
      const val = wine.clues[clueId] ?? 0;
      if (val > 0) maxPossible += val;
    });
    return { ...wine, score, hitCount };
  });
  return scored.sort((a, b) => b.score - a.score);
}

function classifyWine(wine, scored) {
  if (selectedClues.size === 0) return 'neutral';
  if (wine.score < 0) return 'excluded';
  if (wine.score === scored[0].score && wine.score > 0) return 'top-match';
  if (wine.score > 0) return 'included';
  return 'neutral';
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function renderSteps() {
  const panel = document.getElementById('steps-panel');
  const sections = CLUE_SECTIONS[currentType];
  panel.innerHTML = '';

  sections.forEach((section, si) => {
    const div = document.createElement('div');
    div.className = 'step-section' + (si === 0 ? ' open' : '');
    div.id = 'sec-' + section.id;

    const selectedInSection = [...selectedClues].filter(id =>
      section.clues.some(c => c.id === id)
    ).length;

    div.innerHTML = `
      <div class="step-header" onclick="toggleSection('sec-${section.id}')">
        <span class="step-num">${si + 1}</span>
        <div style="flex:1">
          <div class="step-title">${section.title}</div>
          <div class="step-subtitle">${section.subtitle}</div>
        </div>
        <span class="step-selected-count ${selectedInSection > 0 ? 'visible' : ''}" id="cnt-${section.id}">
          ${selectedInSection} gewählt
        </span>
        <span class="step-chevron">▼</span>
      </div>
      <div class="step-body">
        ${section.type === 'color' ? renderColorChips(section.clues) : renderChips(section.clues)}
      </div>
    `;
    panel.appendChild(div);
  });
}

function renderColorChips(clues) {
  return `<div class="color-chips">` + clues.map(c => `
    <div class="color-chip ${selectedClues.has(c.id) ? 'selected' : ''}"
         id="chip-${c.id}"
         onclick="toggleClue('${c.id}')">
      <div class="swatch-circle" style="background:${c.swatch}"></div>
      <div>
        <div class="color-chip-label">${c.label}</div>
        <div style="font-size:0.6rem;color:var(--text-muted);font-family:'DM Mono',monospace;">${c.hint}</div>
      </div>
    </div>
  `).join('') + `</div>`;
}

function renderChips(clues) {
  return `<div class="clue-chips">` + clues.map(c => `
    <div class="chip ${selectedClues.has(c.id) ? 'selected' : ''}"
         id="chip-${c.id}"
         onclick="toggleClue('${c.id}')">
      ${c.label}
    </div>
  `).join('') + `</div>`;
}

function renderCandidates() {
  const scored = scoreWines();
  const listEl = document.getElementById('candidates-list');
  const countEl = document.getElementById('candidate-count');
  const hypoBox = document.getElementById('hypothesis-box');
  const hypoEmpty = document.getElementById('hypothesis-empty');
  const hypoTop = document.getElementById('hypothesis-top');
  const selectedPanel = document.getElementById('selected-clues-panel');
  const selectedTags = document.getElementById('selected-clues-tags');

  if (selectedClues.size === 0) {
    listEl.innerHTML = `<div class="no-selection-hint">Tippe auf Merkmale links,<br>um die Kandidaten einzugrenzen.</div>`;
    countEl.textContent = '— / —';
    hypoBox.classList.remove('active');
    hypoEmpty.style.display = 'block';
    hypoTop.style.display = 'none';
    selectedPanel.style.display = 'none';
    return;
  }

  const included = scored.filter(w => w.score > 0);
  const total = scored.length;
  countEl.textContent = `${included.length} / ${total}`;
  countEl.className = 'candidate-count' + (included.length <= 3 ? ' urgent' : '');

  // Find max score for bar scaling
  const maxScore = Math.max(...scored.map(w => Math.max(0, w.score)), 1);

  listEl.innerHTML = scored.map(wine => {
    const cls = classifyWine(wine, scored);
    const pct = cls === 'excluded' ? 0 : Math.max(0, (wine.score / maxScore) * 100);
    let icon = cls === 'top-match' ? '★' : cls === 'included' ? `+${wine.score}` : cls === 'excluded' ? '✗' : '–';
    return `
      <div class="candidate-item ${cls}">
        <div class="candidate-score-bar">${icon}</div>
        <div class="candidate-info" style="flex:1">
          <div class="candidate-name">${wine.name}</div>
          <div class="candidate-regions">${wine.regions}</div>
          <div class="score-track">
            <div class="score-fill" style="width:${pct}%"></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Hypothesis
  const top3 = scored.filter(w => w.score > 0).slice(0, 3);
  if (top3.length > 0) {
    hypoBox.classList.add('active');
    hypoEmpty.style.display = 'none';
    hypoTop.style.display = 'flex';
    const ranks = ['1.', '2.', '3.'];
    hypoTop.innerHTML = top3.map((w, i) => `
      <div class="hypothesis-entry">
        <span class="hypothesis-rank ${i === 0 ? 'first' : ''}">${ranks[i]}</span>
        <span class="hypothesis-grape ${i === 0 ? 'first' : ''}">${w.name}</span>
        <span class="hypothesis-hint">+${w.score} Pkt.</span>
      </div>
    `).join('');
  } else {
    hypoBox.classList.remove('active');
    hypoEmpty.style.display = 'block';
    hypoEmpty.textContent = 'Keine passenden Kandidaten.';
    hypoTop.style.display = 'none';
  }

  // Selected clues tags
  selectedPanel.style.display = 'block';
  // Get labels
  const allClues = CLUE_SECTIONS[currentType].flatMap(s => s.clues);
  selectedTags.innerHTML = [...selectedClues].map(id => {
    const clue = allClues.find(c => c.id === id);
    const label = clue ? clue.label : id;
    // Shorten label to first word/phrase up to ~20 chars
    const short = label.replace(/^[🍒🍓🫐🟣🌸🌹🫑🌶⚪🌿🖤🛢💧🌍🍄💜🫙🪵🚬🤎🍫🍦⛽🧈🍞🍯🔴🌹🍑🍏🍐🍊🍋🌰💨🐱]+\s*/u, '').split(/[/\s(]/)[0];
    return `<span class="selected-clue-tag" onclick="toggleClue('${id}')">
      ${short} <span class="remove">✕</span>
    </span>`;
  }).join('');
}

// ══════════════════════════════════════════════════════
// INTERACTIONS
// ══════════════════════════════════════════════════════
function setWineType(type) {
  currentType = type;
  selectedClues.clear();

  document.querySelectorAll('.type-tab').forEach(t => {
    t.classList.remove('active-rot', 'active-weiss', 'active-rose');
  });
  document.getElementById('tab-' + type).classList.add('active-' + type);

  renderSteps();
  renderCandidates();
}

function toggleClue(id) {
  if (selectedClues.has(id)) {
    selectedClues.delete(id);
  } else {
    selectedClues.add(id);
  }
  // Update chip appearance
  const el = document.getElementById('chip-' + id);
  if (el) el.classList.toggle('selected', selectedClues.has(id));

  // Update section counters
  CLUE_SECTIONS[currentType].forEach(section => {
    const cnt = document.getElementById('cnt-' + section.id);
    if (!cnt) return;
    const n = [...selectedClues].filter(sid => section.clues.some(c => c.id === sid)).length;
    cnt.textContent = n + ' gewählt';
    cnt.classList.toggle('visible', n > 0);
  });

  renderCandidates();
}

function toggleSection(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function resetAll() {
  selectedClues.clear();
  renderSteps();
  renderCandidates();
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
renderSteps();
renderCandidates();
</script>
